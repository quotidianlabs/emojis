<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Emoji Mart • One component to pick them all</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="One component to pick them all" />
    <meta name="twitter:image" content="./assets/EmojiMart-Social.png" />
    <meta name="twitter:site_name" content="Emoji Mart by Quotidian Labs" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emoji Mart by Quotidian Labs" />
    <meta name="twitter:description" content="One component to pick them all" />
    <meta property="og:image" content="./assets/EmojiMart-Social.png" />
    <meta property="og:site_name" content="Emoji Mart by Quotidian Labs" />
    <meta property="og:title" content="Emoji Mart by Quotidian Labs" />
    <meta property="og:description" content="One component to pick them all" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>"
    />
    <link rel="stylesheet" href="./styles.scss" />
  </head>
  <body>
    <section class="flex flex-center">
      <div>
        <header>
          <h1>
            <em-emoji id="convenience_store"></em-emoji>
            Emoji Mart
          </h1>
          <p class="fork-banner">
            A maintained fork of
            <a href="https://github.com/missive/emoji-mart">emoji-mart</a>,
            unmaintained since 2024. Maintained by
            <a href="https://github.com/quotidianlabs">Quotidian Labs</a>.
          </p>
          <if condition="exampleName">
            <a href="./examples.html">⬅️ Examples</a> → {{ exampleName }}
          </if>
        </header>

        <div class="relative">
          <block name="content">
            <div id="picker" class="flex flex-center"></div>
          </block>
        </div>

        <footer>
          <nav class="flex flex-middle flex-center">
            <if condition="exampleFile">
              <a
                href="https://github.com/quotidianlabs/emojis/blob/main/packages/emojis-website/{{ exampleFile }}"
                class="flex flex-middle"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  height="16"
                  width="16"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                  ></path>
                </svg>
                &nbsp; Source code
              </a>
              &nbsp;•&nbsp;
              <a href="./" title="Home"
                ><em-emoji id="convenience_store"></em-emoji
              ></a>
            </if>
            <else>
              <a
                href="https://github.com/quotidianlabs/emojis"
                class="flex flex-middle"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  height="16"
                  width="16"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                  ></path>
                </svg>
                &nbsp; GitHub
              </a>
              &nbsp;•&nbsp;
              <a href="./examples.html">Examples</a>
            </else>
          </nav>

          <div class="flex flex-center">
            <div id="colophon">
              <p>
                <a href="https://www.npmjs.com/package/@quotidianlabs/emojis"
                  >@quotidianlabs/emojis</a
                >, maintained by
                <a href="https://github.com/quotidianlabs">Quotidian Labs</a>
              </p>
              <p>
                Built from
                <a
                  id="build-commit"
                  href="https://github.com/quotidianlabs/emojis"
                  >an unrecorded commit</a
                >
              </p>
              <script type="module">
                const sha = process.env.SITE_COMMIT_SHA
                if (sha) {
                  const link = document.querySelector('#build-commit')
                  link.textContent = sha
                  link.href = `https://github.com/quotidianlabs/emojis/commit/${sha}`
                }
              </script>
            </div>
          </div>
        </footer>
      </div>
    </section>

    <block name="script"></block>
  </body>
</html>

name: EmojiMart Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - run: yarn install
      - run: yarn prettier
      - run: yarn check:types

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - run: yarn install
      - run: yarn test

  # release.yml runs this again before staging; main can move between a green PR
  # and its merge, and the merge commit is what gets staged.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - run: yarn install
      - run: yarn release:gate

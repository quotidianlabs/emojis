name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish. Data first, then core, then the wrapper.'
        required: true
        type: choice
        options:
          - emojis-data
          - emojis
          - emojis-react
      dist-tag:
        description: 'Dist-tag the version lands on when you approve it.'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: nodenv/actions/node-version@v2.0.10
        id: nodenv

      - uses: actions/setup-node@v4
        with:
          node-version: '${{ steps.nodenv.outputs.node-version }}'
          cache: 'yarn'

      # Trusted publishing needs npm >= 11.5.1; Node 22.23.2 bundles 10.9.8.
      - run: npm install --global npm@11.19.0

      - run: yarn install --frozen-lockfile
      - run: yarn prettier
      - run: yarn check:types
      - run: yarn release:gate

      # Staged, not published: this authenticates over OIDC, but the version
      # only reaches the registry when a maintainer approves it with 2FA.
      - name: Stage the publish
        working-directory: packages/${{ inputs.package }}
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: npm stage publish --tag "$DIST_TAG"

      - name: Tag the staged commit
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          version=$(node -p "require('./packages/$PACKAGE/package.json').version")
          tag="$PACKAGE-v$version"
          git tag "$tag"
          git push origin "$tag"

      - name: How to approve
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          version=$(node -p "require('./packages/$PACKAGE/package.json').version")
          cat <<MESSAGE
          Staged. Nothing is on the registry until you approve it:

            npm stage list @quotidianlabs/$PACKAGE
            npm stage approve <stage-id>

          Inspect the exact tarball first if you want:

            npm stage download <stage-id>

          After approving a Data release, confirm jsDelivr serves it through the
          pin baked into every published core:

            curl -sI "https://cdn.jsdelivr.net/npm/@quotidianlabs/emojis-data@0.1/sets/15/native.json" | grep x-jsd-version

          It should report $version.
          MESSAGE

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Data first, then core, then the wrapper: core is bounded to a Data minor
      # and the wrapper resolves against core.
      - name: Find the packages this merge bumped
        id: bumped
        run: |
          bumped=
          for package in emojis-data emojis emojis-react; do
            manifest="packages/$package/package.json"
            was=$(git show "HEAD^:$manifest" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo none)
            now=$(node -p "require('./$manifest').version")
            if [ "$was" != "$now" ]; then
              echo "$package $was -> $now"
              bumped="$bumped $package"
            fi
          done
          echo "packages=${bumped# }" >>"$GITHUB_OUTPUT"
          if [ -z "$bumped" ]; then echo 'No version changed. Nothing to release.'; fi

      - uses: nodenv/actions/node-version@v2.0.10
        if: steps.bumped.outputs.packages != ''
        id: nodenv

      - uses: actions/setup-node@v4
        if: steps.bumped.outputs.packages != ''
        with:
          node-version: '${{ steps.nodenv.outputs.node-version }}'
          cache: 'yarn'

      # Trusted publishing needs npm >= 11.5.1; Node 22.23.2 bundles 10.9.8.
      - if: steps.bumped.outputs.packages != ''
        run: npm install --global npm@11.19.0

      - if: steps.bumped.outputs.packages != ''
        run: yarn install --frozen-lockfile
      - if: steps.bumped.outputs.packages != ''
        run: yarn prettier
      - if: steps.bumped.outputs.packages != ''
        run: yarn check:types
      - if: steps.bumped.outputs.packages != ''
        run: yarn release:gate

      # Staged, not published: this authenticates over OIDC, but the version
      # only reaches the registry when a maintainer approves it with 2FA.
      - name: Stage the publish
        if: steps.bumped.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.bumped.outputs.packages }}
        run: |
          for package in $PACKAGES; do
            ( cd "packages/$package" && npm stage publish --tag latest )
            version=$(node -p "require('./packages/$package/package.json').version")
            tag="$package-v$version"
            git tag "$tag"
            git push origin "$tag"
          done

      - name: How to approve
        if: steps.bumped.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.bumped.outputs.packages }}
        run: |
          cat <<MESSAGE
          Staged on the latest dist-tag. Nothing is on the registry until you
          approve it:

            npm stage list @quotidianlabs/<package>
            npm stage approve <stage-id>

          Inspect the exact tarball first if you want:

            npm stage download <stage-id>

          Staged:$PACKAGES
          MESSAGE
